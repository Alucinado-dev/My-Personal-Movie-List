<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie WatchList</title>
</head>

<body>
    <header id="header"></header>

    <main>
        <h1>olá <mark id="username">Usuário</mark>, aqui está sua Watchlist</h1>

        <section id="settings"></section>


        <section id="watchlist-movies">
            <article class="movie-item">
                <img  class="movie-poster" src="" alt="">
                <h2 class="movie-title">Nome do Filme</h2>
                <p class="movie-year">Ano de Lançamento</p>
                <p class="movie-genre">Gênero</p>
                <p class="movie-sinopse">Sinopse</p>
                <input type="checkbox" name="watched" id="watched-checkmark">
                <button class="remove-movie">Remover <i class="fa-solid fa-heart-circle-minus"></i></button>    
            </article>
        </section>
        
    </main>

    <footer id="footer"></footer>
</body>
</html>
